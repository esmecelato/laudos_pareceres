<form id="laudoForm">
  <input id="processo" placeholder="Processo nº" required />
  <input id="juizo" placeholder="Juízo / Comarca" required />
  <input id="autor" placeholder="Autor" required />
  <input id="reu" placeholder="Réu" required />
  <input id="tipoImovel" placeholder="Tipo de Imóvel" required />
  <input id="enderecoImovel" placeholder="Endereço do Imóvel" required />
  <input id="dataVistoria" type="date" required />
  <textarea id="conclusao" placeholder="Conclusão Técnica" required></textarea>
  <input id="dataLocal" placeholder="Local e Data" required />
  <button type="submit">Gerar Laudo</button>
</form>

<div id="resultado" style="white-space: pre-wrap; margin-top: 20px;"></div>

<button onclick="gerarWord()">Exportar como Word</button>
<button onclick="gerarPDF()">Exportar como PDF</button>
